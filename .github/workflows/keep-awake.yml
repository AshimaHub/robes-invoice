name: Keep the invoice app awake

on:
  schedule:
    # Free Render web services sleep after 15 minutes without a visit.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the service
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 90 -o /dev/null -w "%{http_code}\n" https://robes-invoice.onrender.com/health
