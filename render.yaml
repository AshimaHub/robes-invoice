# Render Blueprint — Robes Invoice (Next.js + Prisma + Postgres)
# Dashboard: New → Blueprint → connect this repo → apply
# https://dashboard.render.com/blueprints

databases:
  - name: robes-invoice-db
    plan: free

services:
  - type: web
    name: robes-invoice
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: robes-invoice-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Robes Invoice
      # Optional: run once after first deploy via Render Shell:
      #   npx tsx prisma/seed.ts
